name: PlayerHeadsLite
version: 1.1.0
main: com.sagakenichi.playerheadslite.PlayerHeadsLitePlugin
api-version: '1.21.1'
author: sagakenichi
description: Lightweight player-head browser and command for Spigot 1.21.1. Does not drop heads on death.
commands:
  phead:
    description: Opens the player-head GUI or gives a named player's head.
    usage: /phead [player]
    permission: playerheads.use
permissions:
  playerheads.use:
    description: Allows use of /phead and the player-head GUI.
    default: op
